---
version: "3"

vars:
  LOCALBIN: '{{ printf "%s/.bin" .USER_WORKING_DIR }}'
  ENVTEST_VERSION: '{{ .ENVTEST_VERSION | default "release-0.22" }}'
  ENVTEST_K8S_VERSION: '{{ .ENVTEST_K8S_VERSION | default "1.33.0" }}'
  GOLANGCI_LINT_VERSION: '{{ .GOLANGCI_LINT_VERSION | default "v2.4.0" }}'
  CONTROLLER_TOOLS_VERSION: '{{ .CONTROLLER_TOOLS_VERSION | default "v0.18.0" }}'
  KUSTOMIZE_VERSION: '{{ .KUSTOMIZE_VERSION | default "v5.6.0" }}'

tasks:
  default:
    cmds:
      - task: go-tools

  folder:
    label: Ensuring .bin exists
    cmd: mkdir -p .bin
    internal: true
    status:
      - test -d .bin
    generates:
      - .bin

  _internal:*:install:
    label: "{{index .MATCH 0}}:install"
    internal: true
    deps:
      - task: folder
    vars:
      GOPKG: "{{ .GOPKG | default (index .MATCH 0) }}"
      package: "{{ .GOPKG_SRC }}@{{ .GOPKG_VERSION }}"
    env:
      GOBIN: "{{ .USER_WORKING_DIR}}/.bin"
    cmds:
      - echo Downloading {{ .package }}
      - go install {{ .package }}
    generates:
      - .bin/{{.GOPKG }}
    status:
      - test -x .bin/{{.GOPKG }}

  go:setup-envtest:install:
    internal: true
    vars:
      GOPKG: setup-envtest
      package: sigs.k8s.io/controller-runtime/tools/setup-envtest@{{ .ENVTEST_VERSION }}
    env:
      GOBIN: "{{ .USER_WORKING_DIR}}/.bin"
    cmds:
      - echo Downloading {{ .package }}
      - go install "{{ .package}}"
    generates:
      - .bin/setup-envtest
    status:
      - test -x .bin/setup-envtest

  go:k8s:install:
    internal: true
    env:
      GOBIN: "{{ .USER_WORKING_DIR}}/.bin"
    cmds:
      - task: go:setup-envtest:install
      - .bin/setup-envtest use {{ .ENVTEST_K8S_VERSION }} --bin-dir .bin > /dev/null
      - chmod 755 .bin/k8s/{{ .ENVTEST_K8S_VERSION }}-{{OS}}-{{ARCH}}
      - ln -sf {{ .USER_WORKING_DIR}}/.bin/k8s/{{ .ENVTEST_K8S_VERSION }}-{{OS}}-{{ARCH}}/kubectl .bin/kubectl
      - ln -sf {{ .USER_WORKING_DIR}}/.bin/k8s/{{ .ENVTEST_K8S_VERSION }}-{{OS}}-{{ARCH}}/etcd .bin/etcd
      - ln -sf {{ .USER_WORKING_DIR}}/.bin/k8s/{{ .ENVTEST_K8S_VERSION }}-{{OS}}-{{ARCH}}/kube-apiserver .bin/kube-apiserver
    status:
      - test -x .bin/k8s/{{ .ENVTEST_K8S_VERSION }}-{{OS}}-{{ARCH}}/etcd
      - test -x .bin/k8s/{{ .ENVTEST_K8S_VERSION }}-{{OS}}-{{ARCH}}/kube-apiserver
      - test -x .bin/k8s/{{ .ENVTEST_K8S_VERSION }}-{{OS}}-{{ARCH}}/kubectl
      - test -L .bin/etcd
      - test -L .bin/kube-apiserver
      - test -L .bin/kubectl

  go:kustomize:install:
    internal: true
    cmds:
      - task: _internal:kustomize:install
        vars:
          GOPKG_SRC: sigs.k8s.io/kustomize/kustomize/v5
          GOPKG_VERSION: "{{ .KUSTOMIZE_VERSION }}"

  go:golangci-lint:install:
    internal: true
    cmds:
      - task: _internal:golangci-lint:install
        vars:
          GOPKG_SRC: github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          GOPKG_VERSION: "{{ .GOLANGCI_LINT_VERSION }}"

  go:controller-gen:install:
    internal: true
    cmds:
      - task: _internal:controller-gen:install
        vars:
          GOPKG_SRC: sigs.k8s.io/controller-tools/cmd/controller-gen
          GOPKG_VERSION: "{{ .CONTROLLER_TOOLS_VERSION }}"

  go-tools:
    internal: true
    deps:
      - task: folder
      - task: go:k8s:install
      - task: go:kustomize:install
      - task: go:golangci-lint:install
      - task: go:controller-gen:install