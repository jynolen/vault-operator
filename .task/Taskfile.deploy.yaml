---
version: 3

includes:
  deps:
    dir: ..
    taskfile: Taskfile.deps.yaml
    internal: true
  dev:
    dir: ..
    taskfile: Taskfile.dev.yaml
    internal: true

tasks:
  crds:
    desc: Install CRDs into the K8s cluster specified in ~/.kube/config.
    deps:
      - dev:manifests
      - deps:go:k8s:install
    cmds:
      - .bin/kubectl apply -k config/crd
      - .bin/kubectl apply -k config/rbac
    sources:
      - config/crd/**/*.yaml
      - config/rbac/**/*.yaml
  crds:uninstall:
    desc: Uninstall CRDs from the K8s cluster specified in ~/.kube/config. Call with ignore-not-found=true to ignore resource not found errors during deletion.
    deps:
      - dev:manifests
      - deps:go:k8s:install
    cmd: .bin/kubectl delete --ignore-not-found=false -k config/crd

  controller:
    desc: Deploy controller to the K8s cluster specified in ~/.kube/config.
    deps:
      - dev:manifests
      - deps:go:kustomize:install
      - deps:go:k8s:install
    dir: config/manager
    cmds:
      - .bin/kustomize edit set image controller={{.IMG}}
      - .bin/kubectl apply -k config/default"

  controller:uninstall:
    desc: Undeploy controller from the K8s cluster specified in ~/.kube/config. Call with ignore-not-found=true to ignore resource not found errors during deletion.
    deps:
      - deps:go:k8s:install
    cmds:
      - .bin/kubectl delete --ignore-not-found=false -k config/default"

  samples:
    desc: Undeploy controller from the K8s cluster specified in ~/.kube/config. Call with ignore-not-found=true to ignore resource not found errors during deletion.
    deps:
      - crds 
    cmds:
      - .bin/kubectl apply -k config/samples